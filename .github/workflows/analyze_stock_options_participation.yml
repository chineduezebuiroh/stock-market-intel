name: Analyze Stock Options Participation

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Diagnostic phase"
        required: true
        default: "validate"
        type: choice
        options:
          - inventory
          - validate
          - phase3
          - phase3b
      validation_scope:
        description: "Combo validation scope"
        required: true
        default: "cross_combo_phase3b"
        type: choice
        options:
          - cross_combo_phase3b
          - dwm_control
      date_from:
        description: "Optional first lower market date (YYYY-MM-DD); leave blank for all"
        required: false
        type: string
      date_to:
        description: "Optional last lower market date (YYYY-MM-DD); leave blank for all"
        required: false
        type: string

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET_DATA: stock-intel-data-prod
      S3_PREFIX_DATA: data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run read-only participation diagnostic
        shell: bash
        run: |
          set -euo pipefail
          echo "READ-ONLY DIAGNOSTIC"
          echo "NO S3 WRITES"
          echo "NO PRODUCTION CHANGES"

          if [[ "${{ inputs.validation_scope }}" == "cross_combo_phase3b" ]]; then
            if [[ "${{ inputs.phase }}" != "validate" && "${{ inputs.phase }}" != "phase3b" ]]; then
              echo "cross_combo_phase3b requires phase=validate or phase3b" >&2
              exit 2
            fi
            combos=(stocks_c_dwm_all stocks_b_wmq_all stocks_a_mqy_all)
          else
            combos=(stocks_c_dwm_all)
          fi

          overall_status=0
          for combo in "${combos[@]}"; do
            args=(
              --bucket "$S3_BUCKET_DATA"
              --prefix "$S3_PREFIX_DATA"
              --combo "$combo"
              --output-dir "diagnostic_artifacts/$combo"
              --dedupe latest-same-market-date
              --strict-schema
              --phase "$([[ '${{ inputs.phase }}' == phase3b ]] && echo validate || echo '${{ inputs.phase }}')"
              --include-unsupported-era-in-inventory
            )
            if [[ -n "${{ inputs.date_from }}" ]]; then
              args+=(--date-from "${{ inputs.date_from }}")
            fi
            if [[ -n "${{ inputs.date_to }}" ]]; then
              args+=(--date-to "${{ inputs.date_to }}")
            fi
            python diagnostics/analyze_stock_options_participation.py "${args[@]}" || overall_status=$?
          done

          if [[ "${{ inputs.validation_scope }}" == "cross_combo_phase3b" ]]; then
            python diagnostics/summarize_phase3b_validation.py \
              --root diagnostic_artifacts \
              --output diagnostic_artifacts/overall_decision.json
            if [[ "${{ inputs.phase }}" == "phase3b" ]]; then
              python diagnostics/analyze_stock_options_phase3b.py \
                --validated-root diagnostic_artifacts \
                --output-dir diagnostic_artifacts/phase3b
            fi
          fi
          exit "$overall_status"

      - name: Upload local diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-options-participation-${{ inputs.validation_scope }}-${{ github.run_id }}
          path: diagnostic_artifacts/
          if-no-files-found: error
          retention-days: 10
