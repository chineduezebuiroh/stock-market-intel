name: EOD Family Shadow Live Validation

on:
  workflow_dispatch:
    inputs:
      validation_set:
        description: "Bounded symbol set for PR-A shadow validation"
        required: true
        default: tiny
        type: choice
        options:
          - tiny
          - seven

permissions:
  contents: read

jobs:
  validate-shadow-family:
    name: Non-authoritative ${{ inputs.validation_set }} validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATA_BACKEND: s3
      S3_BUCKET_DATA: stock-intel-data-prod
      S3_PREFIX_DATA: data
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      RUN_ID: pr-a-live-${{ inputs.validation_set }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select bounded validation symbols
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.validation_set }}" in
            tiny)  symbols="AAPL MSFT" ;;
            seven) symbols="AAPL MSFT SPY CRWD NVDA JPM XOM" ;;
            *) echo "Unsupported validation set" >&2; exit 2 ;;
          esac
          echo "SYMBOLS=$symbols" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=diagnostic_artifacts/$RUN_ID" >> "$GITHUB_ENV"

      - name: Run non-authoritative EOD family shadow
        shell: bash
        run: |
          set -euo pipefail
          read -ra symbol_args <<< "$SYMBOLS"
          python jobs/run_stock_eod_family_shadow.py \
            --symbols "${symbol_args[@]}" \
            --run-id "$RUN_ID"

      - name: Validate and summarize shadow artifacts
        shell: bash
        run: |
          set -euo pipefail
          read -ra symbol_args <<< "$SYMBOLS"
          python diagnostics/validate_eod_family_shadow.py \
            --run-id "$RUN_ID" \
            --symbols "${symbol_args[@]}" \
            --output-dir "$ARTIFACT_DIR"

      - name: Upload compact shadow validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eod-family-shadow-${{ env.RUN_ID }}
          path: ${{ env.ARTIFACT_DIR }}/
          if-no-files-found: warn
          retention-days: 30
