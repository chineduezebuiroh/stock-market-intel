name: EOD Family Shadow Bridge

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Git ref containing the shadow implementation to validate
        required: true
        default: eod-family-shadow
      validation_set:
        description: Symbol validation set
        type: choice
        required: true
        default: tiny
        options:
          - tiny
          - seven

permissions:
  contents: read

jobs:
  validate-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATA_BACKEND: s3
      S3_BUCKET_DATA: stock-intel-data-prod
      S3_PREFIX_DATA: data
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      RUN_ID: pr-a-bridge-${{ inputs.validation_set }}-${{ github.run_id }}-${{ github.run_attempt }}
      ARTIFACT_DIR: artifacts/eod-family-shadow/pr-a-bridge-${{ inputs.validation_set }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Enforce trusted feature ref
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          if [[ "$TARGET_REF" != "eod-family-shadow" ]]; then
            echo "::error::target_ref must be exactly eod-family-shadow"
            exit 1
          fi

      - name: Checkout trusted shadow implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false

      - name: Verify checked-out implementation
        run: |
          git rev-parse HEAD
          git branch --show-current || true
          test -f jobs/run_stock_eod_family_shadow.py
          test -f diagnostics/validate_eod_family_shadow.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run shadow validation
        env:
          VALIDATION_SET: ${{ inputs.validation_set }}
        run: |
          case "$VALIDATION_SET" in
            tiny) SYMBOLS=(AAPL MSFT) ;;
            seven) SYMBOLS=(AAPL MSFT SPY CRWD NVDA JPM XOM) ;;
            *) echo "::error::Unexpected validation_set"; exit 1 ;;
          esac

          python jobs/run_stock_eod_family_shadow.py \
            --symbols "${SYMBOLS[@]}" \
            --run-id "$RUN_ID"

          python diagnostics/validate_eod_family_shadow.py \
            --run-id "$RUN_ID" \
            --symbols "${SYMBOLS[@]}" \
            --output-dir "$ARTIFACT_DIR"

      - name: Upload shadow validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eod-family-shadow-bridge-${{ env.RUN_ID }}
          path: |
            ${{ env.ARTIFACT_DIR }}/manifest.parquet
            ${{ env.ARTIFACT_DIR }}/indicator_terminals.parquet
            ${{ env.ARTIFACT_DIR }}/interval_summary.csv
            ${{ env.ARTIFACT_DIR }}/summary.md
          if-no-files-found: warn
          retention-days: 30
