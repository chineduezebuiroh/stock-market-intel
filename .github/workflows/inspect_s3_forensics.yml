name: Inspect S3 Forensics

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    env:
      DATA_BACKEND: s3
      S3_BUCKET_DATA: stock-intel-data-prod
      S3_PREFIX_DATA: data
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      #- name: Inspect July 8 DWM history
      #  run: |
      #    python .github/scripts/inspect_s3_combo_history.py

      #- name: Export CAKE historical window
      #  run: |
      #    python .github/scripts/export_s3_forensic_window.py
      
      #- name: Upload forensic artifacts
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: cake-july8-forensic-window
      #    path: forensic_artifacts/
      #    if-no-files-found: error
      #    retention-days: 7

      - name: Inspect CAKE S3 object versions
        run: |
          python .github/scripts/inspect_s3_object_versions.py
