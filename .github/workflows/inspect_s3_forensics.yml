name: Inspect S3 Forensics

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Ticker symbol"
        required: true
        default: "CAKE"
        type: string

      target_date:
        description: "Target market date (YYYY-MM-DD)"
        required: true
        default: "2026-05-20"
        type: string

      combo:
        description: "Combo name"
        required: true
        default: "stocks_c_dwm_all"
        type: string

      rows_before:
        description: "Historical daily rows to export through target date"
        required: true
        default: "180"
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    env:
      DATA_BACKEND: s3
      S3_BUCKET_DATA: stock-intel-data-prod
      S3_PREFIX_DATA: data
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

      FORENSIC_SYMBOL: ${{ inputs.symbol }}
      FORENSIC_TARGET_DATE: ${{ inputs.target_date }}
      FORENSIC_COMBO: ${{ inputs.combo }}
      FORENSIC_ROWS_BEFORE: ${{ inputs.rows_before }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inspect combo history
        run: |
          python .github/scripts/inspect_s3_combo_history.py

      - name: Export surviving daily historical window
        run: |
          python .github/scripts/export_s3_forensic_window.py

      - name: Upload forensic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.symbol }}-${{ inputs.target_date }}-${{ inputs.combo }}-forensics
          path: forensic_artifacts/
          if-no-files-found: error
          retention-days: 7
