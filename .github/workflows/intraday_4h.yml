name: Intraday 4h

on:
  schedule:
    - cron: "1,21,41 * * * 0-5"
  workflow_dispatch:
    inputs:
      profile:
        description: "4h profile to run"
        required: true
        type: choice
        default: futures_4h
        options:
          - futures_4h
          - stocks_4h
          - all_4h

permissions:
  contents: read

jobs:
  futures_4h:
    if: github.event_name == 'schedule' || github.event.inputs.profile == 'futures_4h' || github.event.inputs.profile == 'all_4h'
    runs-on: ubuntu-latest
    concurrency:
      group: futures-intraday
      cancel-in-progress: false
    env:
      DATA_BACKEND: s3
      S3_BUCKET_DATA: stock-intel-data-prod
      S3_PREFIX_DATA: data
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run futures 4h intraday (guarded)
        run: python .github/scripts/run_futures_intraday_4h_guarded.py

  stocks_4h:
    if: github.event_name == 'schedule' || github.event.inputs.profile == 'stocks_4h' || github.event.inputs.profile == 'all_4h'
    runs-on: ubuntu-latest
    concurrency:
      group: stocks-intraday-4h
      cancel-in-progress: false
    env:
      DATA_BACKEND: s3
      S3_BUCKET_DATA: stock-intel-data-prod
      S3_PREFIX_DATA: data
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run stocks 4h intraday (guarded)
        run: python .github/scripts/run_stocks_intraday_4h_guarded.py
