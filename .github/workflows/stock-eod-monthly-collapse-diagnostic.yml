name: Stock EOD Strict R3 Evidence Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-production-monthly-collapse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_BACKEND: s3
      S3_BUCKET_DATA: stock-intel-data-prod
      S3_PREFIX_DATA: data
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnose persisted strict R3 evidence (read-only)
        run: PYTHONPATH=. python diagnostics/diagnose_stock_eod_monthly_collapse.py
